glob_matcher: doublestar
post-merge:
  jobs:
    - name: prepare
      script: prepare.sh
      runner: bash
pre-push:
  jobs:
    - name: check
      script: check.sh
      runner: bash
pre-commit:
  jobs:
    - name: cleanup
      glob: '**/*.{cjs,css,cts,gql,graphql,hbs,htm,html,java,js,json,json5,jsonc,jsx,less,md,mdx,mjs,mts,scss,toml,ts,tsx,vue,yaml,yml}'
      run: |-
        [ -d node_modules ] || bun install --frozen-lockfile || exit
        for file in {staged_files}; do
          case "$file" in
            *.cjs|*.css|*.cts|*.gql|*.graphql|*.hbs|*.htm|*.html|*.js|*.json|*.json5|*.jsonc|*.jsx|*.less|*.md|*.mdx|*.mjs|*.mts|*.scss|*.toml|*.ts|*.tsx|*.vue|*.yaml|*.yml) bun fmt --no-script --no-error-on-unmatched-pattern -- "$file" || exit ;;
          esac
        done
      stage_fixed: true
    - name: check-migrations
      glob: '**/migration.sql'
      run: |-
        failed=0
        for file in {staged_files}; do
          if grep -q 'Warnings:' "$file"; then
            echo "Migration SQL file ($file) contains warnings! Please solve the warnings and commit again."
            failed=1
          fi
        done
        exit "$failed"
    - name: normalize-bun-lockfile
      glob: bun.lock
      run: bash .lefthook/normalize-bun-lockfile.sh {staged_files}
      stage_fixed: true
