name: Test Rust

on:
  workflow_call:
    inputs:
      ci_label:
        default: medium
        required: false
        type: string
      github_hosted_runner:
        description: Cannot override repository visibility; private repositories always use self-hosted runners.
        required: false
        type: boolean
      paths_ignore:
        default: '["**.md", "**/docs/**"]'
        required: false
        type: string
      runs_on:
        description: JSON runner labels. Private overrides must be arrays containing self-hosted; other overrides use the default self-hosted pool.
        required: false
        type: string
      target_organization:
        required: false
        type: string
      test_command:
        default: cargo check --locked --all-targets
        required: false
        type: string
      working_directory:
        default: .
        required: false
        type: string
      no_skip:
        required: false
        type: boolean
jobs:
  pre:
    # To avoid testing on synced (mirrored) repos.
    if: ${{ !inputs.target_organization || github.repository_owner == inputs.target_organization }}
    runs-on: ${{ (inputs.runs_on && (toJSON(github.event.repository.private) == 'false' || (startsWith(inputs.runs_on, '[') && contains(fromJSON(inputs.runs_on), 'self-hosted'))) && fromJSON(inputs.runs_on)) || (toJSON(github.event.repository.private) == 'false' && 'ubuntu-latest') || fromJSON(format('["self-hosted", "{0}"]', inputs.ci_label)) }}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      # GitHub's Branch Protection and Rulesets require job running, so we should not skip entire jobs.
      - if: ${{ !inputs.no_skip }}
        id: skip_check
        uses: fkirc/skip-duplicate-actions@04a1aebece824b56e6ad6a401d015479cd1c50b3
        with:
          cancel_others: false
          skip_after_successful_duplicate: true
          paths_ignore: ${{ inputs.paths_ignore }}
  test-rust:
    needs: [pre]
    runs-on: ${{ (inputs.runs_on && (toJSON(github.event.repository.private) == 'false' || (startsWith(inputs.runs_on, '[') && contains(fromJSON(inputs.runs_on), 'self-hosted'))) && fromJSON(inputs.runs_on)) || (toJSON(github.event.repository.private) == 'false' && 'ubuntu-latest') || fromJSON(format('["self-hosted", "{0}"]', inputs.ci_label)) }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Fork pull-request code must never execute on persistent self-hosted runners: Cargo
      # build scripts and tests would run attacker-controlled code with a persistent workspace.
      # Public fork PRs use GitHub-hosted runners; private fork PRs are unsupported.
      - if: ${{ runner.environment == 'self-hosted' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        name: Reject fork pull requests on self-hosted runners
        run: |
          echo '::error::Fork pull requests are not supported on persistent self-hosted runners.'
          exit 1
      # actions/checkout authenticates over HTTPS with GITHUB_TOKEN on both hosted and
      # self-hosted runners, so self-hosted runners need no SSH deploy key. This workflow never
      # pushes, so the default ref (the pull-request merge ref) is checked out everywhere.
      - if: ${{ needs.pre.outputs.should_skip != 'true' }}
        uses: actions/checkout@v7.0.1
        with:
          # The pull-request merge commit's first parent (HEAD^1) is the base the Cargo.lock gate diffs against.
          fetch-depth: 2
          persist-credentials: false
      # Cargo's resolver has no minimum-publish-age gate before Rust 1.100, so a lockfile update can
      # pull in a crate published minutes ago, and the build below would run its build scripts on this
      # runner. Merge a fix that cannot wait 7 days by bypassing the ruleset. The line-based parser is
      # sound only for the format cargo writes, so the PR's lockfile must use exactly that format: cargo
      # also accepts other TOML spellings (e.g. `source="..."`, trailing comments) and other spellings of
      # the crates.io source (e.g. a trailing `/`) that the parser would skip. Only crates.io and git
      # sources are allowed, since no organization repository uses another registry. `cargo metadata` is
      # no substitute, since it omits entries for inactive optional dependencies. The base lockfile is
      # trusted, and entries missed there only widen the check.
      - if: ${{ needs.pre.outputs.should_skip != 'true' && github.event_name == 'pull_request' }}
        name: Reject crates.io versions published less than 7 days ago
        timeout-minutes: 15
        working-directory: ${{ inputs.working_directory }}
        env:
          MIN_AGE_DAYS: 7
        run: |
          if [[ ! -f Cargo.lock ]] || git show HEAD^1:./Cargo.lock 2> /dev/null | cmp -s - Cargo.lock; then exit 0; fi
          if awk '!/^$/ && !/^#/ && !/^(version = [0-9]+|\[\[(package|patch\.unused)\]\]|(name|version|checksum|replace) = "[^"\\]*"|source = "(registry\+https:\/\/github\.com\/rust-lang\/crates\.io-index|sparse\+https:\/\/index\.crates\.io\/|git\+[^"\\]*)"|dependencies = \[| "[^"\\]*",|\])$/ { print "::error::Cargo.lock line " NR " is not in the format cargo writes or names a source other than crates.io or git; regenerate the lockfile with cargo."; bad = 1 } END { exit !bad }' Cargo.lock; then
            exit 1
          fi
          crates_io_packages() {
            awk '/^\[/ { name = ""; version = "" }
              /^name = / { name = $3 } /^version = / { version = $3 }
              $0 == "source = \"registry+https://github.com/rust-lang/crates.io-index\"" || $0 == "source = \"sparse+https://index.crates.io/\"" { print name, version }' |
              tr -d '"' | sort -u
          }
          failed=0
          while read -r name version; do
            lower="$(tr '[:upper:]' '[:lower:]' <<< "$name")"
            case "${#lower}" in
              1) index_path="1/$lower" ;;
              2) index_path="2/$lower" ;;
              3) index_path="3/${lower:0:1}/$lower" ;;
              *) index_path="${lower:0:2}/${lower:2:2}/$lower" ;;
            esac
            if ! index_entries="$(curl --connect-timeout 10 --max-time 60 --fail --show-error --silent --retry 5 "https://index.crates.io/$index_path")"; then
              echo "::error::Could not fetch $name from the crates.io index (unknown crate or network error); re-run this job if the error was transient."
              failed=1
              continue
            fi
            age_days="$(jq -r --arg version "$version" 'select(.vers == $version and .pubtime) | (now - (.pubtime | fromdateiso8601)) / 86400 | floor' <<< "$index_entries")"
            if [[ -z "$age_days" ]]; then
              echo "::error::$name $version is not in the crates.io index with a publish time."
              failed=1
            elif (( age_days < MIN_AGE_DAYS )); then
              echo "::error::$name $version was published $age_days day(s) ago; crates.io versions must be at least $MIN_AGE_DAYS days old. Re-run this job once it is."
              failed=1
            fi
          done < <(comm -13 <(git show HEAD^1:./Cargo.lock 2> /dev/null | crates_io_packages) <(crates_io_packages < Cargo.lock))
          exit "$failed"
      - if: ${{ needs.pre.outputs.should_skip != 'true' }}
        name: Set up rustup
        # Self-hosted runners may not have rustup; install it once into the persistent home directory.
        run: |
          if ! command -v rustup > /dev/null && [[ ! -x "$HOME/.cargo/bin/rustup" ]]; then
            curl --proto '=https' --tlsv1.2 --fail --show-error --silent https://sh.rustup.rs | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - if: ${{ needs.pre.outputs.should_skip != 'true' }}
        name: Install Rust toolchain
        working-directory: ${{ inputs.working_directory }}
        run: |
          # rust-toolchain(.toml) should pin a concrete toolchain so builds don't drift across runs.
          if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
            rustup toolchain install
          else
            echo '::warning::No rust-toolchain(.toml) found; falling back to the latest stable toolchain.'
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustup show
      - if: ${{ needs.pre.outputs.should_skip != 'true' && runner.os == 'Linux' }}
        name: Install Tauri system dependencies
        working-directory: ${{ inputs.working_directory }}
        # cf. https://tauri.app/start/prerequisites/#linux
        run: |
          if compgen -G 'tauri.conf.*' > /dev/null || [[ -f Tauri.toml ]]; then
            if ! dpkg -s libwebkit2gtk-4.1-dev > /dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
            fi
          fi
      # Self-hosted runners keep the working directory (including target/) across runs.
      - if: ${{ needs.pre.outputs.should_skip != 'true' && runner.environment != 'self-hosted' }}
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: ${{ inputs.working_directory }}
      - if: ${{ needs.pre.outputs.should_skip != 'true' }}
        name: Test
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.test_command }}
