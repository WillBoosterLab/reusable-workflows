name: Apply autofix

# Commits the patch produced by the caller's test run onto the pull request head.
#
# This exists because a GITHUB_TOKEN push triggers no workflows, so the old in-job push-back left
# pull requests unable to satisfy required checks (pull_request_target workflows such as the
# semantic-pr title check never re-ran at all). Pushing as a GitHub App fixes that, but an App
# credential must never reach the job that installs and runs the pull request's dependencies.
# workflow_run gives us exactly that separation: this job runs in the BASE repository's context,
# from the DEFAULT branch's workflow definition, and executes no repository code — it only moves
# a validated JSON patch into a commit.
on:
  workflow_call:
    inputs:
      target_organization:
        required: false
        type: string
    secrets:
      AUTOFIX_APP_PRIVATE_KEY:
        description: Private key of that App. Never exposed to any step that runs repository code.
        required: true

permissions:
  # Reading the triggering run's artifact. Note this is the workflow's OWN GITHUB_TOKEN; the
  # commit itself uses the App token, because GITHUB_TOKEN pushes would not re-trigger checks.
  actions: read
  contents: read

jobs:
  apply:
    # Fork pull requests must not reach this job: workflow_run runs with the base repository's
    # secrets, so a fork's patch would otherwise be committed with the App's privileges. The App
    # also cannot push to a fork's branch, making this both a security and a correctness gate.
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && (!inputs.target_organization || github.repository_owner == inputs.target_organization) }}
    runs-on: ubuntu-latest
    steps:
      - name: Look for a patch from the triggering run
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          : # Captured into a variable rather than piped straight into grep: in a pipeline the
          : # step's exit status is grep's, so an API failure would read as "no patch" and the
          : # fix would be dropped silently. --paginate defeats the same silent miss when a run
          : # produced more artifacts than one page holds.
          NAMES="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].name')"
          if grep -qx autofix-patch <<< "$NAMES"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            : # The overwhelmingly common case: the fixers found nothing to change.
            echo 'No autofix patch was produced by the triggering run; nothing to do.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      # Scoped deliberately narrower than the installation: one repository, and only the single
      # permission the commit needs. An installation covering every repository in the organization
      # therefore still yields a token that can write to exactly this one.
      - if: ${{ steps.artifact.outputs.found == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          # Constant, not an input or a secret: one Autofixer App serves every organization, and
          # an App ID is public anyway (an unauthenticated GET /apps/{slug} returns it) and useless
          # without the private key. Keeping it out of the inputs leaves callers with nothing to
          # configure but the key itself.
          app-id: '4388928'
          private-key: ${{ secrets.AUTOFIX_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # A patch on top of a commit this App already made means the fixers did not converge: the
      # apply would push, re-trigger the tests, and produce another patch indefinitely. The old
      # push-back could not loop because a GITHUB_TOKEN push re-triggered nothing, so this guard
      # replaces a property we are deliberately giving up. Fail loudly rather than burn runners.
      # Matching the App's own bot login is exact: it identifies THIS App rather than any bot, and
      # it does not depend on `.author.type` (App bot authors do report `Bot` there — verified
      # against renovate[bot] — but the login comparison needs no such assumption).
      - if: ${{ steps.artifact.outputs.found == 'true' }}
        name: Refuse to loop on non-convergent fixers
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          AUTHOR="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA" --jq '.author.login // ""')"
          if [[ "$AUTHOR" == "$APP_SLUG[bot]" ]]; then
            echo "::error::The fixers still report changes on top of a previous autofix commit ($HEAD_SHA), so they are not idempotent. Refusing to push again; fix the non-deterministic generator instead."
            exit 1
          fi

      - if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: autofix-patch
          path: ${{ runner.temp }}/autofix-patch
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: WillBooster/reusable-workflows/.github/actions/apply-autofix-patch@main
        with:
          patch_file: ${{ runner.temp }}/autofix-patch/autofix.json
          app_token: ${{ steps.app-token.outputs.token }}
          repository: ${{ github.repository }}
          # Derived from the event, never from the patch, so the patch cannot redirect the write.
          branch: ${{ github.event.workflow_run.head_branch }}
          expected_head_oid: ${{ github.event.workflow_run.head_sha }}
