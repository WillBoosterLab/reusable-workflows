name: Apply release-age gate
description: >-
  Fail the job when the Yarn or Bun on PATH is too old to enforce the organization's
  minimum-release-age policy, and write that policy into an ephemeral GitHub-hosted runner's GLOBAL
  package-manager configs (~/.bunfig.toml, ~/.yarnrc.yml, ~/.npmrc) before any install.
  WillBooster/shared's packages/wbfy/configs/releaseAgeGate.json is the single source of truth and
  the script next to it the single implementation, shared with the self-hosted runners
  (self-host-utils) and developer machines (wbfy), so every environment ends up with byte-identical
  settings. Project-level configuration takes precedence in all three managers, so wbfied
  repositories keep their own (identical) gate and exclusion list. Known gaps: Yarn 1 supports no
  gate at all yet is exempt (Yarn 2 through 4.10.2 fail the job instead, since they must be upgraded
  rather than kept), and npm is not probed — the npm bundled with the caller's Node ignores the gate
  entirely below 11.10 and only the exclusion list below 11.17.
runs:
  using: composite
  steps:
    # No secret is exposed to this step: `yarn --version` runs the yarn-path/yarnPath binary the
    # CHECKED-OUT repository points at, which is attacker-controlled on a fork pull request.
    - name: Reject package managers too old to enforce the minimum-release-age policy
      shell: bash
      run: |
        # An out-of-date package manager ignores the gate settings SILENTLY and installs ungated
        # (verified: Yarn 4.9.4 resolves a quarantined version with a warning while 4.10.3 blocks
        # it; Bun < 1.3.0 treats minimumReleaseAge as an unknown bunfig key), so it must fail the
        # job here instead. Yarn 1 is exempt — a known policy gap — and is also what `yarn` resolves
        # to on a runner whose repository does not use Yarn Berry at all.
        YARN_VERSION="$(yarn --version 2> /dev/null || echo 1.0.0)"
        if [[ "$YARN_VERSION" != 1.* ]] && \
           [[ "$(printf '%s\n' 4.10.3 "$YARN_VERSION" | sort -V | head -n 1)" != '4.10.3' ]]; then
          echo "::error::Yarn $YARN_VERSION cannot enforce npmMinimalAgeGate reliably (requires Yarn >= 4.10.3), so installs would run without the organization's release-age gate or resolve a prerelease in its place; upgrade Yarn."
          exit 1
        fi
        if command -v bun > /dev/null; then
          BUN_VERSION="$(bun --version)"
          if [[ "$(printf '%s\n' 1.3.0 "$BUN_VERSION" | sort -V | head -n 1)" != '1.3.0' ]]; then
            echo "::error::Bun $BUN_VERSION cannot enforce minimumReleaseAge (requires Bun >= 1.3.0), so installs would run without the organization's release-age gate; upgrade Bun."
            exit 1
          fi
        fi

    - name: Apply the minimum-release-age policy to global package-manager configs
      shell: bash
      env:
        SHARED_API_URL: https://api.github.com/repos/WillBooster/shared
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Self-hosted runners are provisioned by self-host-utils with the same content from the same
        # policy file, and rewriting their machine-global configs from a job would race with the
        # installs of the other jobs sharing the machine.
        if [[ "${RUNNER_ENVIRONMENT:-}" != 'github-hosted' ]]; then exit 0; fi
        cd "$(mktemp -d)"
        # The authenticated Contents API instead of anonymous raw.githubusercontent.com, whose
        # per-IP limit rate-limits runners with 429s; retry so a blip cannot fail the job. The
        # commit is resolved once so the script and the policy it reads always come from the same
        # revision, which a coordinated update of the two needs.
        fetch() { curl --fail --show-error --silent --retry 5 --retry-all-errors --retry-delay 2 -H "authorization: Bearer ${GITHUB_TOKEN}" "$@"; }
        SHARED_SHA="$(fetch -H 'accept: application/vnd.github.sha' "$SHARED_API_URL/commits/main")"
        for file in applyReleaseAgeGate.sh releaseAgeGate.json; do
          fetch -H 'accept: application/vnd.github.raw+json' \
            -o "$file" "$SHARED_API_URL/contents/packages/wbfy/configs/$file?ref=$SHARED_SHA"
        done
        # The token is for the fetch only: the downloaded script never reads it, and it comes from
        # another repository's main.
        env -u GITHUB_TOKEN bash applyReleaseAgeGate.sh
